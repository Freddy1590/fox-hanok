<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="scene-title scene-desc" data-season="summer">
  <title id="scene-title">A hanok through the seasons</title>
  <desc id="scene-desc">A conceptual cutaway of a Korean hanok, rather than a specific building, with a raised wooden maru on the right and an ondol room on the left. Summer breezes travel below the maru. In winter, heat travels under the ondol floor and exits through a chimney.</desc>
  <defs>
    <pattern id="tiles" width="25" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(13)">
      <path d="M0 0V22M25 0V22M0 20Q12 27 25 20" fill="none" stroke="#7c827d" stroke-width="1" opacity=".7"/>
      <path d="M3 0V20" stroke="#343d38" stroke-width="3"/>
    </pattern>
    <pattern id="paper-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ede6d3"/>
      <path d="M0 0H20M0 0V20M10 0V20M0 10H20" fill="none" stroke="#a89473" stroke-width="1.3"/>
    </pattern>
    <pattern id="brick" width="28" height="20" patternUnits="userSpaceOnUse">
      <rect width="28" height="20" fill="#9d9b8c"/>
      <path d="M0 0H28M0 10H28M14 0V10M0 10V20M28 10V20" stroke="#c8c3b0" fill="none"/>
    </pattern>
    <clipPath id="roof-front"><path d="M259 157L743 269Q727 340 681 391Q416 348 120 270Q203 256 259 157Z"/></clipPath>
  </defs>
  <style>
    #summer-effects, #sun-summer { opacity: 1; transition: opacity .65s ease; }
    #winter-effects, #snow-winter, .snow-edge { opacity: 0; transition: opacity .65s ease; }
    :root[data-season="winter"] #summer-effects, :root[data-season="winter"] #sun-summer { opacity: 0; }
    :root[data-season="winter"] #winter-effects, :root[data-season="winter"] #snow-winter,
    :root[data-season="winter"] .snow-edge { opacity: 1; }
    .breeze { stroke-dasharray: 90 35 14 35; animation: breeze 4s linear infinite; }
    .breeze:nth-child(2) { animation-delay: -1.3s; }
    .breeze:nth-child(3) { animation-delay: -2.6s; }
    .heat { stroke-dasharray: 20 18; animation: warmth 2.8s linear infinite; }
    .smoke { animation: smoke 4.5s ease-in-out infinite; transform-origin: 841px 306px; }
    .flake { animation: snowfall 6s ease-in-out infinite; }
    .flake:nth-child(even) { animation-delay: -3s; }
    .winter-floor { transition: fill .65s ease; }
    :root[data-season="winter"] .winter-floor { fill: #cb9657; }
    @keyframes breeze { to { stroke-dashoffset: -348; } }
    @keyframes warmth { to { stroke-dashoffset: -152; } }
    @keyframes smoke { 0%,100% { transform: translateY(3px); opacity: .4; } 50% { transform: translateY(-9px); opacity: .85; } }
    @keyframes snowfall { 0%,100% { transform: translate(0,-6px); } 50% { transform: translate(5px,6px); } }
    :root[data-paused="true"] * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>

  <!-- The open front is a teaching cutaway, rather than a depiction of a specific building. -->
